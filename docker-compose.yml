# 一键部署：docker compose up -d
# 准备：复制 nbco.json.example 为 nbco.json，
#   postgres_dsn 用 postgres://nbco:nbco@postgres:5432/nbco?sslmode=disable
#   qdrant.url 用 http://qdrant:6334，qdrant.api_key 与 QDRANT_API_KEY 一致
#   listen 用 0.0.0.0:8900（容器内监听）
services:
  postgres:
    # Keep the deployed major version stable; 17.10 is the latest PostgreSQL
    # 17 security/bug-fix release. Major upgrades require pg_upgrade/dump-restore.
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: nbco
      POSTGRES_PASSWORD: nbco
      POSTGRES_DB: nbco
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbco"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  nbco:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./nbco.json:/etc/nbco/nbco.json:ro
    ports:
      - "127.0.0.1:8900:8900"
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
