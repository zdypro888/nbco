      entries:
        - id: e_f8464ac7
          kind: contract
          text: domain_outbox_events 用 occurrence_key 表示不可变领域发生项；相同 key 的 topic/payload 不同必须 ErrConflict。消费者只按自己声明的 topic 认领，使用 PostgreSQL 时钟、SKIP LOCKED、短租约和有限重试恢复。
          confidence: verified
          at: 2026-08-20T13:39:44.171123Z
          confirmed_at: 2026-08-20T13:40:41.313298Z
          author: codex-mcp-client
        - id: e_d7ae22fe
          kind: pitfall
          text: outbox 只解决数据库事实与待处理副作用的原子提交；跨 PostgreSQL 与 Telegram 的发送仍不可能事务原子化，消费者必须继续使用稳定 delivery key 的 Telegram 分片账本，结果不确定时禁止盲目重发。
          confidence: verified
          at: 2026-08-20T13:39:44.17359Z
          confirmed_at: 2026-08-20T13:40:41.731709Z
          author: codex-mcp-client
      keywords:
        - domain outbox
