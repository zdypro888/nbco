      entries:
        - id: e_562f81e2
          kind: pitfall
          text: RetryAutomationRun 只推进 available_at，不会主动唤醒重试；若调用方只在狭窄日/小时窗口内执行 ClaimAutomationRun，指数退避跨出窗口后该 occurrence 会永久停在 pending。2026-08 线上周报 W29/W31/W32 均在第 5 次后 available_at 落到触发小时之外，未再被领取。
          confidence: inferred
          at: 2026-08-05T07:51:07.784181Z
          author: codex-mcp-client
          superseded_by: e_7eaa8328
        - id: e_7eaa8328
          kind: contract
          text: 自动化重试由每个 occurrence 的 expires_at 界定，而非调用方狭窄小时窗口；日/周/月调度在完整有效期内持续认领，统一清理过期 pending 或失租 processing。普通重试保留 action_started、结果文本和已有业务 outcome，replay-safe 重试仅在完整轨迹证明零副作用后清空它们；耗尽预算或过期将运行状态置 failed，但不覆盖已证明的 succeeded/no_change outcome。
          confidence: inferred
          at: 2026-08-05T08:31:02.552322Z
          author: codex-mcp-client
      keywords:
        - automation retry window
        - pending stranded
        - available_at
        - 周报重试
