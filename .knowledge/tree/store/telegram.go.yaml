        - id: e_aaea1249
          kind: contract
          text: ApplyTelegramBotMembershipUpdate 只接受带正 update_id 和精确 status 的 my_chat_member 事实；按群 advisory lock 原子应用有序成员状态，并在同一事务中为 inactive→active 写入唯一的 telegram.bot_membership.activated outbox 事件。返回值只表示本次是否新建事件，调用方不得直接执行欢迎发送。
          confidence: verified
