          text: For a newly claimed worker run, worker_run_attempts.heartbeat_at=NULL means the HTTP payload has not been confirmed by the worker. Such claims use the short delivery timeout; after the first heartbeat they use the normal long execution lease.
          confidence: verified
          at: 2026-07-20T14:31:45.770775Z
          confirmed_at: 2026-08-20T06:38:57.764112Z
          author: codex-mcp-client
        - id: e_611932bc
          kind: pitfall
          text: The worker must retry the first heartbeat after ambiguous HTTP failures. Returning to polling can strand a claim when the database update succeeded but the response was lost.
          confidence: verified
          at: 2026-07-20T14:31:45.771212Z
          confirmed_at: 2026-08-20T06:38:52.171068Z
          author: codex-mcp-client
