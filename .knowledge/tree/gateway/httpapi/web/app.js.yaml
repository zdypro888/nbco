      entries:
        - id: e_da68e9be
          kind: pitfall
          text: 控制中心的 `pendingFiles` 直接等于最近文件列表长度，且每个文件都渲染为“待处理”；`loadFiles` 返回的是近 30 天文件库，不含材料处理生命周期。因此该数字不是可清零的工作队列，已分析/已使用文件也会持续显示待处理。
          confidence: refuted
          at: 2026-08-20T04:59:26.222774Z
          author: codex-mcp-client
          refuted_by: chg_20260820T064124Z_f53cc7f79d160bc7
        - id: e_efe8607f
          kind: pitfall
          text: 控制中心“待处理材料”必须来自 material_cases 的 active 生命周期视图，而不是最近上传文件总数；文件库是审计/下载目录，材料队列是可清零的运营工作，两者不可再混算。
          confidence: inferred
          at: 2026-08-20T06:41:35.786987Z
          author: codex-mcp-client
