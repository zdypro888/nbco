        - id: e_712d8837
          kind: contract
          text: 流式编辑器启动时只续 typing，不立即创建占位消息；首个可见 delta 才发送占位。finish 必须先停止后台编辑，再让最终首片编辑/兜底发送与后续分片共用 conversation turn 的持久投递账本，避免重放留下空占位或重复最终答复。
          confidence: inferred
          at: 2026-08-20T13:02:08.432128Z
          author: codex-mcp-client
      keywords:
