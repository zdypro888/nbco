        - id: e_2684094c
          kind: contract
          text: Bot 自身成员生命周期只有 my_chat_member 一个权威输入；handleMyChatMember 只把事实交给原子状态转换并唤醒 outbox。new_chat_members/left_chat_member 只作服务消息观察，两个原始 handler 都不得直接发送欢迎；用户可见副作用由持久领域事件的 Telegram 适配器执行。
