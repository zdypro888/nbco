        - id: e_ff449785
          kind: contract
          text: Telegram SDK 的长轮询回调 handle 不执行任何业务，只把完整 update 持久化到统一 inbox 并唤醒消费者；webhook 也必须走同一 enqueueInboundUpdate。业务处理、认领、续租、完成和重试只能发生在 inbox 消费链，避免两种传输模式形成不同语义。
          confidence: inferred
          at: 2026-08-20T13:02:48.664013Z
          author: codex-mcp-client
