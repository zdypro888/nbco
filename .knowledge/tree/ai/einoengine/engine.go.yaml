    - id: ai/einoengine/engine.go#collect
      level: function
      anchor:
        file: ai/einoengine/engine.go
        symbol: collect
        hash: sha256:58f01a6b7b406a33db1a3d86000a41352535f45c556824522cc61ac7a250a717
        struct_hash: sha256:b74bae82d900cadb992586a0f49c49750735b35cc28e7d802caa4500722f54c2
        doc_struct_hash: sha256:3e2ca7557f25a76c7a289f86010fc6059c137313111f7e0b325bf0ed7c4898a0
        lines: [797, 921]
      status: fresh
      since: 2026-07-19T18:32:51.345695Z
      entries:
        - id: e_2f424a09
          kind: pitfall
          text: collect 只要看到一条无 tool_calls 的非空 assistant Content 就将其当 finalText，并在流结束后正常返回；它不判断目标是否完成、是否需要工具证据或文本是否只是未来承诺。因此 provider 的 finish_reason=stop 只是正常文本终止，不能证明 Deep 任务已完成。
          confidence: refuted
          at: 2026-07-19T19:27:16.799156Z
          author: codex-mcp-client
          refuted_by: chg_20260719T195725Z_fbc1249fcec64374
        - id: e_d9e9c20b
          kind: contract
          text: Deep 模式(requireStructuredFinal=true)只把 final_response 对应的 return-direct 工具结果作为最终用户文本，并从业务 Steps 中隐藏该内部协议调用；OneShot 才接受普通 assistant Content 直接结束。
          confidence: verified
          at: 2026-07-19T19:57:29.76127Z
          confirmed_at: 2026-07-19T19:57:46.268784Z
          author: codex-mcp-client
          retired_by: chg_20260719T221913Z_8f1486007401f79d
        - id: e_a4238baf
          kind: pitfall
          text: 不要看到 collect 仍有普通 Content→finalText 分支就判断 Deep 可以口头结束；该分支明确受 !requireStructuredFinal 保护。Eino 的 WillRetryError 既可能出现在 AgentEvent.Err，也可能从流读取返回，两条路径都必须视为非终态继续消费。
          confidence: verified
          at: 2026-07-19T19:57:29.761414Z
          confirmed_at: 2026-07-19T19:57:46.444172Z
          author: codex-mcp-client
          retired_by: chg_20260719T221914Z_63821c62a96f8468
        - id: e_b9bf7b71
          kind: pitfall
          text: Eino 的 AgentEvent 仍可能暴露 provider 原始的“业务工具 + final_response”混合批次，即使 AfterModelRewriteState 已从持久状态删除提前收尾；collect 必须同步忽略该 final_response，否则会把已归一化的合法执行误判为终止错误。
          confidence: inferred
          at: 2026-07-19T20:14:58.644417Z
          author: codex-mcp-client
          retired_by: chg_20260719T221913Z_7a399f62c2842978
        - id: e_d768b37a
          kind: contract
          text: Deep 未收到有效 final_response 时，仅在 req.Tools 中的真实业务工具已经返回后才可保留 Steps 进入 OneShot 渲染修复；只有 tool_search/skill/write_todos 或单纯耗尽输出预算都必须失败回滚。
          confidence: inferred
          at: 2026-07-19T20:14:58.645042Z
          author: codex-mcp-client
          retired_by: chg_20260719T221913Z_2495f6847c2c883e
        - id: e_2a951b25
          kind: contract
          text: collect 只消费 Eino 原生事件：assistant 无工具调用的 Content 成为最终答复，assistant ToolCalls 与后续 Tool 结果按 ToolCallID 配对进 Steps；不再解释任何自定义终止工具。
          confidence: verified
          at: 2026-07-19T22:19:20.582367Z
          confirmed_at: 2026-07-20T03:55:25.977115Z
          author: codex-mcp-client
        - id: e_c756fa1e
          kind: pitfall
          text: Eino 的 WillRetryError 可能从 AgentEvent.Err 或流读取两条路径出现，两处都必须继续消费而非当作终态；其他终端错误若已有轨迹则 preservePartialAgentError 保留已发生工具证据。
          confidence: verified
          at: 2026-07-19T22:19:20.582581Z
          confirmed_at: 2026-07-20T03:55:25.806228Z
          author: codex-mcp-client
      keywords:
        - mixed final tool call
        - provider original event
        - aftermodelrewritestate
        - 业务工具返回
        - structured final repair
