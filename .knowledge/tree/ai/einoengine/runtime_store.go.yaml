      entries:
        - id: e_c97d23d4
          kind: contract
          text: Durable Eino events must be redacted after JSON decoding and before re-encoding. Serialized bytes are never passed through regex redaction because escaped quotes inside tool/user strings can be corrupted.
          confidence: refuted
          at: 2026-07-20T14:31:45.669123Z
          author: codex-mcp-client
          refuted_by: chg_20260720T152623Z_4525f756d28ecef9
        - id: e_c2b9b1da
          kind: pitfall
          text: Message.Content may itself contain JSON. Redaction must recurse into JSON-shaped string values before applying plain-text secret patterns; otherwise nested escaped command quotes can still be damaged.
          confidence: refuted
          at: 2026-07-20T14:31:45.669571Z
          author: codex-mcp-client
          refuted_by: chg_20260720T152622Z_b2961b365f7cc9c9
        - id: e_dac6f8e7
          kind: contract
          text: 'Eino managed-session events are private canonical Agent working memory: persist serialized user/tool/assistant events losslessly and validate serializer round-trip; do not redact or rewrite event content here.'
          confidence: inferred
          at: 2026-07-20T15:26:29.691205Z
          author: codex-mcp-client
        - id: e_3cb62954
          kind: pitfall
          text: It is easy to treat the runtime event table as a log and redact it. It is actually replay state used by later Agent iterations/resume; destructive redaction silently changes behavior. Apply credential redaction only when projecting to embeddings, learning, audits, or logs.
          confidence: inferred
          at: 2026-07-20T15:26:29.691908Z
          author: codex-mcp-client
      keywords:
        - eino managed session canonical event
        - credential continuity
        - runtime event trust boundary
        - session resume exact tool result
