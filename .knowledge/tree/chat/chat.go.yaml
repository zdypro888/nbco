      entries:
        - id: e_2f3027fc
          kind: contract
          text: Side-effect result synthesis receives only the current user request and current tool evidence. Historical dialogue and rules are retained for read-only analysis but cannot prove persisted configuration parameters or subsystem behavior.
          confidence: refuted
          at: 2026-07-20T14:31:45.878385Z
          confirmed_at: 2026-07-20T15:00:55.595232Z
          author: codex-mcp-client
          refuted_by: chg_20260721T105531Z_8013216fe0a8c209
        - id: e_b2e87c39
          kind: contract
          text: 'Factual event-bus turns set EvidenceOnly: final OneShot receives only source_text plus current read-tool evidence, never first Agent draft/history. If that synthesis fails, runTurn returns an error so the event bus persists and sends its factual fallback instead of an ungrounded model reply.'
          confidence: refuted
          at: 2026-07-20T15:00:50.108312Z
          author: codex-mcp-client
          refuted_by: chg_20260721T105531Z_3bfecdfa758cdf34
        - id: e_fc00c159
          kind: pitfall
          text: 不要把终端截断恢复误读为正常轮次的回复控制层：runTurn 只在 needsVisibleReplyRepair 识别到空/极短且达到输出上限的残片时运行无工具、无会话 OneShot；正常 DeepAgent assistant 输出不做二次合成，自动化只通过 ReadOnly 裁剪能力。
          confidence: verified
          at: 2026-07-21T10:55:42.540554Z
          confirmed_at: 2026-07-21T10:55:49.698102Z
          author: codex-mcp-client
        - id: e_5268c796
          kind: contract
          text: 交互对话的跨轮事实只来自 chat_messages 滚动摘要/近期原文与同事务 action_turns 执行投影；每个 conversation_turn 使用独立 Eino managed session，Eino 事件只负责该轮 DeepAgent 工具循环、checkpoint 和恢复，绝不能再次把 chat_sessions.engine_ref 当私聊跨轮上下文。
          confidence: verified
          at: 2026-07-25T10:14:56.538902Z
          confirmed_at: 2026-08-06T07:27:29.598118Z
          author: codex-mcp-client
        - id: e_e0e435f3
          kind: pitfall
          text: terminal repair 是无工具、无会话的结果整理；若让下一轮恢复上一轮 Eino session，agent_error 回滚会漏掉用户已看到的 repaired reply。必须先原子完成 conversation_turn，再由下一轮重放规范业务事实。
          confidence: verified
          at: 2026-07-25T10:14:56.539913Z
          confirmed_at: 2026-08-06T07:27:29.303732Z
          author: codex-mcp-client
