          text: systemPrompt 只定义与具体措辞无关的 Agent 不变量：当前发言人目标优先、权限裁剪工具及其结果为事实边界、读写意图不混淆、多步骤持续执行、稳定 ID 作为内部主键、按需加载知识/Skill、指定执行介质不可静默替换；具体能力发现和编排交给 Eino 原生 Deep Agent/tool_search。
          confidence: inferred
          at: 2026-08-20T06:40:42.202265Z
          author: codex-mcp-client
        - id: e_f182dfec
          kind: pitfall
          text: 不要把线上失败样例、用户原句、对象名称或工具名追加为 systemPrompt 路由规则；该函数允许写通用安全/事实/状态机契约和渠道不变量，但不承担第二套规划器、完成判官或工具预选器职责。
          confidence: inferred
          at: 2026-08-20T06:40:42.204307Z
          author: codex-mcp-client
        - id: e_3651a7fa
          kind: contract
          text: 普通私聊和群聊 mention 都由同一 Eino DeepAgent 规划；确定性代码只负责权限、稳定 ID、协议、生命周期、幂等与传输。不得按具体业务句式、员工名或线上样例增加路由分支。
          confidence: inferred
          at: 2026-08-21T09:45:07.709674Z
          author: codex-mcp-client
        - id: e_bc6e6266
          kind: pitfall
          text: 修复“只回答不执行”不能靠完成话术过滤或动作完成门；应检查工具是否对当前权限可见、工具契约是否清楚、Agent 是否收到真实结果以及副作用是否有幂等边界。
          confidence: inferred
          at: 2026-08-21T09:45:07.711543Z
          author: codex-mcp-client
      keywords:
        - eino deepagent
        - 场景补丁
        - 话术分支
        - agent 路由
        - 自主工具组合
      era_summary: 2026-07-19 的 Agent 架构经历一次验证驱动的收敛：先恢复 Eino 原生 Deep Agent 持续执行契约、跨轮工具目录刷新和未知工具的模型阶段原地纠正，并一度加入权限裁剪后的语义 schema 预选；随后用线上同款模型在 174 工具、零预选条件下验证 Eino 原生 tool_search 能自主找到并执行 Worker，因而删除 PreferredTools 与额外语义预选器，确立“单一 Deep Agent 负责规划执行，业务层只保留权限、协议、幂等、会话隔离和执行证据”的边界。必须保留的负知识：不得按用户原话、关键词、问号、语言或具体业务对象写路由；不得每轮直接注入全部 174 个工具 schema；不得在未知工具后从头重跑整轮以免重复副作用；不得在 Agent 外增加动作规划器或自然语言完成判官；不得在 Deep Agent 前再加一轮 LLM 工具预选；也不得借去硬编码之名删除权限、schema、会话隔离或执行证据校验，这些是稳定系统不变量。
      era_until: 2026-07-19T21:45:31.764703Z
