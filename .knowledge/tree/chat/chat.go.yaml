      entries:
        - id: e_e5aed164
          kind: pitfall
          text: 被动群消息仅把 speaker 作为 `【name】` 文本前缀写入 ChatMessage；ChatMessage 本身没有 actor_user_id、外部 actor/message ID 或 reply/thread 引用。Telegram 已见成员另存于 SeenTelegramGroupMember，但两者不关联。因此改名、重名及按人归因/审计不能依赖消息表稳定完成。
          confidence: refuted
          at: 2026-08-20T04:59:26.056439Z
          author: codex-mcp-client
          refuted_by: chg_20260820T063911Z_f57b00bbc9aaa170
        - id: e_f916d95f
          kind: pitfall
          text: 不要只看兼容入口的空 MessageEnvelope 就断言群消息没有稳定身份：Telegram 正常路径调用 RecordGroupMessageWithEnvelope，消息表保存外部来源/actor，且同步投影为 work_evidence；只有显式调用旧兼容入口时才没有外部身份。
          confidence: inferred
          at: 2026-08-20T06:39:17.222387Z
          author: codex-mcp-client
