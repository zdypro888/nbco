    - id: chat/action_plan.go#buildActionAudit
      level: function
      anchor:
        file: chat/action_plan.go
        symbol: buildActionAudit
        hash: sha256:8d6d5e86bae116b32cf7c29908584c9f33a5388ace47199247886d15a9f7956b
        struct_hash: sha256:7e34f6ef41135d673abf3fcefef96dadcd689ff9ccf99f8a56b3113f2c35d94a
        doc_struct_hash: sha256:7e34f6ef41135d673abf3fcefef96dadcd689ff9ccf99f8a56b3113f2c35d94a
        lines: [22, 56]
      status: fresh
      since: 2026-07-21T10:54:43.989798Z
      entries:
        - id: e_e43b8a2c
          kind: contract
          text: 当前 action plan 是纯事后 tool-trace 审计：RequiresAction 和 ExpectedTools 仅由已经发生的 write/execute 调用或待审批结果推导。零工具轮次无论用户目标/助手承诺是什么都会得到 RequiresAction=false、ExpectedTools=[]，最终 outcome=answered_without_tool；该账本因此不能充当未闭合目标的可恢复执行状态。
          confidence: inferred
          at: 2026-07-19T19:27:16.898859Z
          confirmed_at: 2026-07-19T22:19:37.026273Z
          author: codex-mcp-client
          superseded_by: e_3187426f
        - id: e_d7341080
          kind: pitfall
          text: 若要恢复未执行承诺，必须在引擎执行前或结构化终止时建立独立 execution contract；不能从本函数的事后轨迹重建，因为零工具时意图信息已被有意丢弃。
          confidence: inferred
          at: 2026-07-19T19:27:16.898925Z
          confirmed_at: 2026-07-19T22:19:37.204734Z
          author: codex-mcp-client
          superseded_by: e_3187426f
        - id: e_7ff5a228
          kind: contract
          text: 动作账本只基于实际 tool trace：ExpectedTools 记录尝试过的写入/执行工具；actionTurnOutcome 优先识别待审批，其次识别最终成功的 ExpectedTools。先失败后同轮恢复成功应记 action_tool_returned，早期失败仍完整保留在 tool_evidence；若动作工具始终失败，即使只读工具成功也记 tool_handler_error。
          confidence: suspect
          at: 2026-07-20T02:48:10.570001Z
          author: codex-mcp-client
          superseded_by: e_3187426f
        - id: e_3187426f
          kind: contract
          text: actionAudit 是 DeepAgent 返回后的纯观测账本：ActionTools 只记录本轮真实出现的 write/execute 或待审批调用，并映射到历史数据库列 expected_tools；零工具轮次记 answered_without_tool。它不得触发重试、补执行、改写回复或充当持久任务队列。
          confidence: verified
          at: 2026-07-21T10:55:42.680941Z
          confirmed_at: 2026-07-21T10:55:49.942536Z
          author: codex-mcp-client
        - id: e_559b69cf
          kind: pitfall
          text: buildActionAudit 的 requires_action 仅由实际发生的 tool call 推导，因此无法观测“用户意图需要写操作但 Agent 未调用工具”的漏执行。线上曾出现员工提交日报后 tool_count=0，却回复“已记录”；这种漏执行不会被现有 action audit 标记。
          confidence: inferred
          at: 2026-08-05T07:51:21.64681Z
          author: codex-mcp-client
      keywords:
        - intent tool mismatch
        - 只说不做
        - requires_action
        - 漏执行审计
