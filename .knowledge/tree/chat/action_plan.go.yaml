      entries:
        - id: e_e43b8a2c
          kind: contract
          text: 当前 action plan 是纯事后 tool-trace 审计：RequiresAction 和 ExpectedTools 仅由已经发生的 write/execute 调用或待审批结果推导。零工具轮次无论用户目标/助手承诺是什么都会得到 RequiresAction=false、ExpectedTools=[]，最终 outcome=answered_without_tool；该账本因此不能充当未闭合目标的可恢复执行状态。
          confidence: verified
          at: 2026-07-19T19:27:16.898859Z
          confirmed_at: 2026-07-19T22:19:37.026273Z
          author: codex-mcp-client
        - id: e_d7341080
          kind: pitfall
          text: 若要恢复未执行承诺，必须在引擎执行前或结构化终止时建立独立 execution contract；不能从本函数的事后轨迹重建，因为零工具时意图信息已被有意丢弃。
          confidence: verified
          at: 2026-07-19T19:27:16.898925Z
          confirmed_at: 2026-07-19T22:19:37.204734Z
          author: codex-mcp-client
        - id: e_7ff5a228
          kind: contract
          text: 动作账本只基于实际 tool trace：ExpectedTools 记录尝试过的写入/执行工具；actionTurnOutcome 优先识别待审批，其次识别最终成功的 ExpectedTools。先失败后同轮恢复成功应记 action_tool_returned，早期失败仍完整保留在 tool_evidence；若动作工具始终失败，即使只读工具成功也记 tool_handler_error。
          confidence: inferred
          at: 2026-07-20T02:48:10.570001Z
          author: codex-mcp-client
      keywords:
        - 工具恢复
        - 部分失败
        - action_tool_returned
        - tool_handler_error
        - 审计归类
        - tool evidence
