          author: codex-mcp-client
        - id: e_16d8e20a
          kind: pitfall
          text: 不要把 Telegram 群摘要改回“每个接收人运行 DeepAgent 再调用 list_telegram_group_messages”。这会把确定性读取变成工具发现问题，_all 配置时按人数放大模型轮次，并可能在超时兜底中外发内部工具证据。
          confidence: verified
          at: 2026-07-23T14:09:07.166531Z
          confirmed_at: 2026-08-19T15:39:14.081462Z
