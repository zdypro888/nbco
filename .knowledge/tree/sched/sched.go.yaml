        - id: e_97ad2fed
          kind: contract
          text: 可写定时维护以 automation_runs 的 action_started 作为不可重放边界；完整 Eino 轮次的真实工具轨迹经 tool-free 评估并受确定性副作用守卫约束后，才把业务 outcome 记为 succeeded/no_change。无成功副作用且轮次完整时可清边界重试；已有写入或中断只做只读核对并记 uncertain/failed。结果先持久化再投递，通知失败只重发同一报告且不得覆盖业务 outcome。
