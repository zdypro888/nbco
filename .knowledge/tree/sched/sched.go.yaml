          text: source_kind=telegram_group_digest 的日程不是通用个性化广播：接收人必须由日程 target 决定（通常 self），调度器按 occurrence 所在业务日构造封闭群消息窗口并直接读取事实；有消息交 Eino OneShot 无工具总结，无消息确定性返回事实边界。重试沿用 schedule_delivery.result_text，避免再次生成。
          confidence: inferred
