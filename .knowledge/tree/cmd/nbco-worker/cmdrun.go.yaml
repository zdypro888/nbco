      entries:
        - id: e_48dbd845
          kind: pitfall
          text: Command summaries place stdout/stderr before the command text because event/tool excerpts are bounded from the front. Reversing the order can hide the only failure evidence behind a long generated command while still exposing exit 0.
          confidence: inferred
          at: 2026-07-20T15:00:50.209914Z
          author: codex-mcp-client
      keywords:
        - command summary ordering
        - bounded event output
