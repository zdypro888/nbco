      entries:
        - id: e_a5533cf8
          kind: contract
          text: CompanyOverview 的闭集事实来自任务、项目和目标统计，不汇入群消息/群摘要中的工作进展；Scheduler 周报直接依赖该结果。因此员工只在群里汇报、未形成任务时，公司周报会合法地产生“无进行中事项”，即沟通事实与正式工作事实当前是两套域。
          confidence: refuted
          at: 2026-08-20T04:59:26.385892Z
          author: codex-mcp-client
          refuted_by: chg_20260820T063828Z_b4c6b603b12173d9
        - id: e_462c7ce2
          kind: pitfall
          text: 不要把 CompanyOverview 误读成只统计正式任务：它同时读取近 7 天 work_evidence 并明确以“区别于正式任务”的区块展示群聊、摘要和执行证据；这些证据仍不能自动视为任务承诺或验收结果。
          confidence: inferred
          at: 2026-08-20T06:38:33.473168Z
          author: codex-mcp-client
      keywords:
        - 公司总览
        - 工作证据
        - 群聊证据
        - 正式任务区别
        - weekly report facts
