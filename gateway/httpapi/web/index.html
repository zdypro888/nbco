<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nbco · 公司运营中枢</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#1c2330; --muted:#6b7280;
    --accent:#2563eb; --accent-weak:#eff4ff; --red:#dc2626; --red-weak:#fef2f2;
    --green:#16a34a; --green-weak:#f0fdf4; --amber:#d97706; --amber-weak:#fffbeb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
  header .logo{font-weight:700;font-size:18px}
  header .who{color:var(--muted);font-size:13px;margin-left:auto}
  header button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  /* 登录 */
  #login{max-width:420px;margin:12vh auto 0}
  #login h1{font-size:20px;margin:0 0 6px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 14px}
  #login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  #login button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;
    background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
  #login .err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
  /* 标签页 */
  nav{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted)}
  nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 对话 */
  #chatlog{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:56vh;overflow-y:auto;padding:4px 2px}
  .msg{max-width:86%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;color:var(--muted);font-size:12px;background:none;padding:2px}
  #chatform{display:flex;gap:8px;margin-top:10px}
  #chatform textarea{flex:1;resize:none;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    font:inherit;height:44px;max-height:120px}
  #chatform button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 18px;cursor:pointer}
  #chatform button:disabled{opacity:.5;cursor:default}
  /* 任务列表 */
  .task{display:flex;gap:10px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .task:last-child{border-bottom:0}
  .task .tid{color:var(--muted);font-size:12px;min-width:36px}
  .task .title{flex:1;min-width:180px}
  .task .meta{color:var(--muted);font-size:12px}
  .task .meta.overdue{color:var(--red);font-weight:600}
  .badge{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .b-pending{background:var(--amber-weak);color:var(--amber)}
  .b-in_progress{background:var(--accent-weak);color:var(--accent)}
  .b-done{background:var(--amber-weak);color:var(--amber)}
  .b-accepted{background:var(--green-weak);color:var(--green)}
  .b-split{background:var(--bg);color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:24px 0;font-size:13px}
  /* 全景 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{color:var(--muted);font-size:12px}
  .stat.warn .n{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  h3{font-size:14px;margin:18px 0 8px}
  .hint{color:var(--muted);font-size:12px;margin-top:12px}
</style>
</head>
<body>

<div id="login" class="card" hidden>
  <h1>nbco</h1>
  <p>在 Telegram 里对 AI 说「给我生成 Access Token」，把结果粘贴到这里。</p>
  <input id="token" type="password" placeholder="Access Token" autocomplete="off">
  <button id="loginBtn">进入</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <span class="logo">nbco</span>
    <span class="who" id="who"></span>
    <button id="logout">退出</button>
  </header>
  <nav id="tabs">
    <button data-tab="chat" class="on">对话</button>
    <button data-tab="todo">我的待办</button>
    <button data-tab="review">待验收</button>
    <button data-tab="assigned">我分配的</button>
    <button data-tab="overview" id="tabOverview" hidden>全景</button>
  </nav>

  <section id="view-chat" class="card">
    <div id="chatlog"><div class="msg sys">与 Telegram 入口能力相同：派任务、查进展、催办、存知识……直接说事。</div></div>
    <form id="chatform">
      <textarea id="chatinput" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="chatsend" type="submit">发送</button>
    </form>
  </section>

  <section id="view-todo" class="card" hidden></section>
  <section id="view-review" class="card" hidden></section>
  <section id="view-assigned" class="card" hidden></section>
  <section id="view-overview" hidden></section>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get token(){ return localStorage.getItem("nbco_token") || ""; },
  set token(v){ v ? localStorage.setItem("nbco_token", v) : localStorage.removeItem("nbco_token"); },
};
let me = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Bearer " + store.token, "Content-Type": "application/json", ...(opts.headers||{}) },
  });
  if (res.status === 401) { showLogin("登录已失效，请重新输入 Token"); throw new Error("未认证"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

/* ---------- 登录 ---------- */
function showLogin(err) {
  store.token = "";
  me = null;
  $("#app").hidden = true;
  $("#login").hidden = false;
  $("#loginErr").textContent = err || "";
}
async function tryEnter() {
  try {
    me = await api("/api/me");
    $("#login").hidden = true;
    $("#app").hidden = false;
    $("#who").textContent = me.name + (me.is_superadmin ? " · 超管" : "");
    $("#tabOverview").hidden = !me.is_superadmin;
  } catch (e) { /* showLogin 已处理 401；其它错误提示 */
    if (store.token) $("#loginErr").textContent = e.message;
  }
}
$("#loginBtn").onclick = () => { store.token = $("#token").value.trim(); $("#token").value = ""; tryEnter(); };
$("#token").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logout").onclick = () => showLogin();

/* ---------- 标签页 ---------- */
const loaders = { todo: loadTodo, review: loadReview, assigned: loadAssigned, overview: loadOverview };
$("#tabs").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll("section[id^=view-]").forEach(v => v.hidden = true);
  const tab = btn.dataset.tab;
  $("#view-" + tab).hidden = false;
  if (loaders[tab]) loaders[tab]();
});

/* ---------- 对话 ---------- */
function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  $("#chatlog").appendChild(div);
  $("#chatlog").scrollTop = $("#chatlog").scrollHeight;
  return div;
}
$("#chatform").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("#chatinput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  bubble("me", text);
  const wait = bubble("sys", "思考中…");
  $("#chatsend").disabled = true;
  try {
    const { reply } = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
    wait.remove();
    bubble("ai", reply);
  } catch (err) {
    wait.remove();
    bubble("sys", "出错了：" + err.message);
  } finally {
    $("#chatsend").disabled = false;
    input.focus();
  }
});
$("#chatinput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chatform").requestSubmit(); }
});

/* ---------- 任务列表 ---------- */
const STATUS = { pending:"待处理", in_progress:"进行中", done:"待验收", accepted:"已完成", split:"已拆分" };
function fmtTime(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function renderTasks(el, tasks, opts = {}) {
  el.innerHTML = "";
  if (!tasks.length) { el.innerHTML = `<div class="empty">（空）</div>`; return; }
  for (const t of tasks) {
    const row = document.createElement("div");
    row.className = "task";
    const overdue = t.deadline && new Date(t.deadline) < new Date() && (t.status === "pending" || t.status === "in_progress");
    row.innerHTML =
      `<span class="tid">#${t.id}</span>` +
      `<span class="title">${esc(t.title)}</span>` +
      `<span class="badge b-${t.status}">${STATUS[t.status] || t.status}</span>` +
      (opts.who === "assignee" ? `<span class="meta">${esc(t.assignee_name || "")}</span>` :
       opts.who === "assigner" ? `<span class="meta">来自 ${esc(t.assigner_name || "")}</span>` : "") +
      (t.deadline ? `<span class="meta ${overdue ? "overdue" : ""}">截止 ${fmtTime(t.deadline)}</span>` : "") +
      (t.nudge_count ? `<span class="meta overdue">已催办 ${t.nudge_count} 次</span>` : "");
    el.appendChild(row);
  }
}
function esc(s){ const d = document.createElement("span"); d.textContent = s ?? ""; return d.innerHTML; }

async function loadTodo()    { renderTasks($("#view-todo"),    (await api("/api/me/tasks")).tasks,   { who:"assigner" }); }
async function loadReview()  { renderTasks($("#view-review"),  (await api("/api/me/review")).tasks,  { who:"assignee" }); }
async function loadAssigned(){ renderTasks($("#view-assigned"),(await api("/api/me/assigned")).tasks,{ who:"assignee" }); }

/* ---------- 全景 ---------- */
async function loadOverview() {
  const el = $("#view-overview");
  el.innerHTML = `<div class="empty">加载中…</div>`;
  const d = await api("/api/overview");
  const s = d.stats;
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${s.open}</div><div class="l">进行中</div></div>
      <div class="stat ${s.overdue ? "warn" : ""}"><div class="n">${s.overdue}</div><div class="l">已过期</div></div>
      <div class="stat"><div class="n">${s.awaiting}</div><div class="l">待验收</div></div>
      <div class="stat"><div class="n">${s.done_week}</div><div class="l">近7天完成</div></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">项目</h3>
      <table><thead><tr><th>项目</th><th>状态</th><th>进行中</th><th>待验收</th><th>已完成</th></tr></thead>
      <tbody>${d.projects.map(p =>
        `<tr><td>#${p.id} ${esc(p.name)}</td><td>${p.status === "active" ? "进行" : "归档"}</td><td>${p.open}</td><td>${p.awaiting}</td><td>${p.accepted}</td></tr>`
      ).join("") || `<tr><td colspan="5" class="empty">（无项目）</td></tr>`}</tbody></table>
      <h3>过期任务</h3>
      <div id="ov-overdue"></div>
    </div>`;
  renderTasks($("#ov-overdue"), d.overdue, { who:"assignee" });
}

/* ---------- 启动 ---------- */
if (store.token) { tryEnter(); } else { showLogin(); }
</script>
</body>
</html>
