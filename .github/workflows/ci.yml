name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nbco
          POSTGRES_PASSWORD: nbco
          POSTGRES_DB: nbco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nbco"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test（含 store 集成测试）
        env:
          NBCO_TEST_PG_DSN: postgres://nbco:nbco@localhost:5432/nbco_test?sslmode=disable
        run: go test ./...
